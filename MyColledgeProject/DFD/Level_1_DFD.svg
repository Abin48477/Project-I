  <path d="M 140 420 L 140 580" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="145" y="500" font-family="Arial" font-size="18" text-anchor="start">Dosha Result</text>

  <path d="M 600 390 L 210 650" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="405" y="520" font-family="Arial" font-size="18" text-anchor="middle">Prod List</text>

  <path d="M 70 650 Q 0 650 0 350 Q 0 90 50 90" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="25" y="370" font-family="Arial" font-size="18" transform="rotate(-90, 25, 370)" text-anchor="middle">Recos</text>

  <path d="M 230 110 L 530 650" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="380" y="380" font-family="Arial" font-size="18" text-anchor="middle">Cart Item</text>

  <path d="M 600 720 L 600 930" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="610" y="825" font-family="Arial" font-size="18">Pay Req</text>

  <path d="M 970 1000 L 670 1000" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="820" y="995" font-family="Arial" font-size="18" text-anchor="middle">Token</text>

  <path d="M 600 930 L 600 880" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="610" y="905" font-family="Arial" font-size="18">Save</text>

  <path x="1060" y="130" d="M 1060 130 L 1060 280" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="1065" y="200" font-family="Arial" font-size="18">Manage</text>

  <path x="1060" y="420" d="M 1060 420 L 1060 540" fill="none" stroke="black" stroke-width="1.5" />
  <path d="M 1060 550 L 1060 610" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="1065" y="500" font-family="Arial" font-size="18">Logs</text>

  <path d="M 990 350 L 850 350" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="920" y="345" font-family="Arial" font-size="18" text-anchor="middle">Update</text>

</svg>