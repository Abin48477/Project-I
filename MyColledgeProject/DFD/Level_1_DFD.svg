<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="1100" viewBox="0 0 1200 1100" xmlns="http://www.w3.org/2000/svg" style="background-color: white;">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="black" />
    </marker>
  </defs>

  <!-- External Entities -->
  <rect x="50" y="50" width="180" height="80" fill="white" stroke="black" stroke-width="2" />
  <text x="140" y="95" font-family="Arial" font-size="26" font-weight="bold" text-anchor="middle">User</text>

  <rect x="970" y="50" width="180" height="80" fill="white" stroke="black" stroke-width="2" />
  <text x="1060" y="95" font-family="Arial" font-size="26" font-weight="bold" text-anchor="middle">Admin</text>

  <rect x="970" y="970" width="180" height="80" fill="white" stroke="black" stroke-width="2" />
  <text x="1060" y="1015" font-family="Arial" font-size="26" font-weight="bold" text-anchor="middle">eSewa</text>

  <!-- Processes -->
  <circle cx="350" cy="90" r="70" fill="white" stroke="black" stroke-width="2" />
  <text x="350" y="85" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">1.0</text>
  <text x="350" y="110" font-family="Arial" font-size="20" text-anchor="middle">User Auth</text>

  <circle cx="140" cy="350" r="70" fill="white" stroke="black" stroke-width="2" />
  <text x="140" y="345" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">2.0</text>
  <text x="140" y="370" font-family="Arial" font-size="20" text-anchor="middle">Dosha Quiz</text>

  <circle cx="140" cy="650" r="70" fill="white" stroke="black" stroke-width="2" />
  <text x="140" y="645" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">3.0</text>
  <text x="140" y="670" font-family="Arial" font-size="20" text-anchor="middle">Reco Engine</text>

  <circle cx="600" cy="650" r="70" fill="white" stroke="black" stroke-width="2" />
  <text x="600" y="645" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">4.0</text>
  <text x="600" y="670" font-family="Arial" font-size="20" text-anchor="middle">Ordering</text>

  <circle cx="600" cy="1000" r="70" fill="white" stroke="black" stroke-width="2" />
  <text x="600" y="995" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">5.0</text>
  <text x="600" y="1020" font-family="Arial" font-size="20" text-anchor="middle">Verify Pay</text>

  <circle cx="1060" cy="350" r="70" fill="white" stroke="black" stroke-width="2" />
  <text x="1060" y="345" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">6.0</text>
  <text x="1060" y="370" font-family="Arial" font-size="20" text-anchor="middle">Prod CRUD</text>

  <!-- Data Stores -->
  <path d="M 600 50 L 850 50 M 600 130 L 850 130" fill="none" stroke="black" stroke-width="2" />
  <text x="725" y="95" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">D1: Users DB</text>

  <path d="M 600 310 L 850 310 M 600 390 L 850 390" fill="none" stroke="black" stroke-width="2" />
  <text x="725" y="355" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">D2: Products DB</text>

  <path d="M 500 800 L 750 800 M 500 880 L 750 880" fill="none" stroke="black" stroke-width="2" />
  <text x="625" y="845" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">D3: Orders DB</text>

  <path d="M 950 610 L 1180 610 M 950 690 L 1180 690" fill="none" stroke="black" stroke-width="2" />
  <text x="1065" y="655" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">D4: Messages</text>

  <!-- Data Flows -->
  <path d="M 230 90 L 280 90" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="255" y="85" font-family="Arial" font-size="18" text-anchor="middle">Login</text>
  
  <path d="M 420 90 L 600 90" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="510" y="85" font-family="Arial" font-size="18" text-anchor="middle">Verify</text>

  <path d="M 140 130 L 140 280" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)" />
